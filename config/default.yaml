# PhysTutorBench default configuration

# Student simulator (controlled variable — do not change between benchmark runs)
student_simulator:
  model: "claude-sonnet-4-6"
  temperature: 0.7
  max_tokens: 1024

# LLM judge configuration
judge:
  model: "claude-opus-4-8"
  temperature: 0.0
  max_tokens: 4096

# Conversation engine settings
conversation:
  max_turns: 15
  transfer_injection_offset: 2  # Inject transfer problem N turns before max
  tutor_system_prompt: |
    You are a physics tutor working with an introductory physics student.
    Your goal is to help the student develop genuine understanding, not just
    get the right answer. Use Socratic questioning, bridging analogies, and
    scaffolding to guide the student toward correct reasoning. Do not simply
    tell the student the answer — help them construct understanding themselves.

# Batch runner settings
batch:
  concurrency: 5
  results_dir: "results"
  cost_limit_usd: 50.0  # Abort if estimated cost exceeds this

# Scoring weights for composite score
scoring_weights:
  misconception_diagnosis: 0.20
  scaffolding_strategy: 0.20
  answer_disclosure_restraint: 0.15
  conceptual_model_building: 0.20
  transfer_success: 0.15
  pedagogical_harm_avoidance: 0.10

# Paths
paths:
  taxonomy: "data/taxonomies/misconception_taxonomy.json"
  scenarios: "data/scenarios"
  results: "results"
  validation: "data/validation"
